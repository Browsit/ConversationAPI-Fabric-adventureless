plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def jitProps = gradle.startParameter.projectProperties
version = jitProps['version'] ?: project.mod_version
group = jitProps['group'] ?: project.maven_group

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://jitpack.io" }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

configurations {
    // Fabric API itself is never shipped and never declared in fabric.mod.json or the published
    // POM (generated off runtimeElements). It is only needed (a) to compile, because
    // adventure-platform-fabric's class signatures reference fabric-api types, and (b) for dev
    // runs. Note that the bundled adventure-platform-fabric mod hard-depends at runtime on
    // fabric-api-base / fabric-command-api-v2, so Fabric API must be installed alongside.
    fabricApiDevOnly
    runtimeClasspath {
        extendsFrom fabricApiDevOnly
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    fabricApiDevOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation("net.kyori:adventure-platform-fabric:${project.adventure_platform_version}") {
        exclude group: "net.fabricmc.fabric-api"
    }
    implementation "net.kyori:adventure-text-serializer-legacy:${project.adventure_version}"

    implementation("com.github.Browsit.ConversationAPI:api:${project.conversation_version}") {
        changing = true
        exclude group: "net.kyori", module: "adventure-platform-api"
        exclude group: "net.kyori", module: "adventure-api"
    }
    implementation("com.github.Browsit.ConversationAPI:impl:${project.conversation_version}") {
        changing = true
        exclude group: "net.kyori", module: "adventure-platform-api"
        exclude group: "net.kyori", module: "adventure-api"
        exclude group: "net.kyori", module: "adventure-text-serializer-legacy"
    }

    include("com.github.Browsit.ConversationAPI:api:${project.conversation_version}") {
        changing = true
        transitive = false
        exclude group: "net.kyori", module: "adventure-platform-api"
        exclude group: "net.kyori", module: "adventure-api"
    }
    include("com.github.Browsit.ConversationAPI:impl:${project.conversation_version}") {
        changing = true
        transitive = false
        exclude group: "net.kyori", module: "adventure-platform-api"
        exclude group: "net.kyori", module: "adventure-api"
        exclude group: "net.kyori", module: "adventure-text-serializer-legacy"
    }
    include("net.kyori:adventure-text-serializer-legacy:${project.adventure_version}") {
        transitive = false
    }
    include("net.kyori:adventure-platform-fabric:${project.adventure_platform_version}") {
        transitive = false
    }

    implementation fileTree(dir: "libs", include: ["*.jar"])
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version, "adventure_platform_version": project.adventure_platform_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

base {
    archivesName = project.archives_base_name
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}