plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

def jitProps = gradle.startParameter.projectProperties
version = jitProps['version'] ?: project.mod_version
group = jitProps['group'] ?: project.maven_group

repositories {
    mavenCentral()
    maven { url = "https://maven.fabricmc.net/" }
    maven { url = "https://libraries.minecraft.net/" }
    maven { url = "https://jitpack.io" }
}

configurations.all {
    resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
}

configurations {
    // Fabric API is never shipped and never declared in fabric.mod.json or the published
    // POM (generated off runtimeElements). It is only needed for dev runs.
    fabricApiDevOnly
    runtimeClasspath {
        extendsFrom fabricApiDevOnly
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    compileOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    fabricApiDevOnly "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    implementation("com.github.Browsit.ConversationAPI-adventureless:api:${project.conversation_version}") {
        changing = true
    }
    implementation("com.github.Browsit.ConversationAPI-adventureless:impl:${project.conversation_version}") {
        changing = true
    }

    include("com.github.Browsit.ConversationAPI-adventureless:api:${project.conversation_version}") {
        changing = true
        transitive = false
    }
    include("com.github.Browsit.ConversationAPI-adventureless:impl:${project.conversation_version}") {
        changing = true
        transitive = false
    }

    implementation fileTree(dir: "libs", include: ["*.jar"])
}

processResources {
    inputs.property "version", project.version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    options.release = targetJavaVersion
    options.encoding = "UTF-8"
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
    withSourcesJar()
}

base {
    archivesName = project.archives_base_name
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }
}